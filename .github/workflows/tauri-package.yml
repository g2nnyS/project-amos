name: Tauri package

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            arch: x86_64-unknown-linux-gnu
            artifacts: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - os: ubuntu-latest
            platform: linux-arm64
            arch: aarch64-unknown-linux-gnu
            artifacts: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch || '' }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          
          # Add ARM64 architecture for installing libraries
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          
          # Install ARM64 system dependencies
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev:arm64 \
            libssl-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64
          
          # Configure pkg-config for cross-compilation
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          
          # Set cross-compilation environment variables
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build backend and console
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build ${{ matrix.arch && format('-- --target {0}', matrix.arch) || '' }}
        env:
          # Build unsigned installers; signing credentials are not available to CI
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: amos-console-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
