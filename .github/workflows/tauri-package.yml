name: Tauri package

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            arch: x86_64-unknown-linux-gnu
            artifacts: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: aarch64-unknown-linux-gnu
            artifacts: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch || '' }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        shell: bash
        env:
          # beforeBuildCommand runs the backend and console build plus runtime staging.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: |
          set -euo pipefail

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ -n "${APPLE_CERTIFICATE:-}" ]]; then
              if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
                echo "::error::APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set"
                exit 1
              fi
              if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
                echo "::error::APPLE_SIGNING_IDENTITY is required when APPLE_CERTIFICATE is set"
                exit 1
              fi
              if [[ -z "${KEYCHAIN_PASSWORD:-}" ]]; then
                echo "::error::KEYCHAIN_PASSWORD is required when APPLE_CERTIFICATE is set"
                exit 1
              fi
              [[ -n "${APPLE_ID:-}" ]] || unset APPLE_ID
              [[ -n "${APPLE_PASSWORD:-}" ]] || unset APPLE_PASSWORD
              [[ -n "${APPLE_PROVIDER_SHORT_NAME:-}" ]] || unset APPLE_PROVIDER_SHORT_NAME
            else
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_PROVIDER_SHORT_NAME
              export APPLE_SIGNING_IDENTITY=-
            fi
          fi

          if [[ -n "${{ matrix.arch }}" ]]; then
            npm run tauri -- build --target "${{ matrix.arch }}"
          else
            npm run tauri -- build
          fi

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: node scripts/verify-tauri-macos.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: amos-console-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
