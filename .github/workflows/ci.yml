name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

# Read-only token: this workflow only checks out and tests code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  branch-name:
    name: Branch name convention
    # Pull requests only; push events have no head branch to validate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate head branch name
        env:
          # Untrusted input is passed through the environment, never interpolated
          # directly into the shell script.
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HEAD_REF" =~ ^(feat|fix|chore|docs|refactor|test|ci)/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Branch name is valid: $HEAD_REF"
            exit 0
          fi

          echo "::error::Branch '$HEAD_REF' does not match the required convention."
          echo "Allowed: (feat|fix|chore|docs|refactor|test|ci)/<lowercase-slug>"
          echo "Example: feat/security-boundary-hardening"
          echo "Bot branches (dependabot/, renovate/) are intentionally not exempt; see CONTRIBUTING.md."
          exit 1
