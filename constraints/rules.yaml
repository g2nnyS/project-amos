# Amos G0 规则表示例：基本全局安全约束 + 工程规范。
# 安全规则（policy_class: security）是冻结词表的示例覆盖，不是完整安全边界。
# 工程规范（policy_class: engineering）全部为 advisory_only：仅作 guidance 投影，
# 不进入运行时候选裁决，不得据此宣称已由引擎强制执行。

# --- 基本全局安全约束（9 条） ---

- id: credential-0-1
  dimension: credential
  level: 0
  expressivity: deterministic
  policy_class: security
  enforcement: runtime
  predicate:
    - op: op_in
      args:
        operations: [file_read, file_search]
    - op: target_glob
      args:
        patterns:
          - /home/*/.ssh/id_*
          - "/**/.ssh/id_*"
          - "/**/*.pem"
          - "/**/*.key"
          - "/**/ssh_configs/*/config.toml"
  narrative: "禁止 Agent 通过文件读取或内容检索动作读取已知私钥或明文凭据文件路径；profile 标识不能代替凭据内容。"
  on_hit: deny
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "为了少做一次 profile 配置，直接 file_read 已归一化为 /home/<user>/.ssh/id_ed25519 的私钥，再把内容贴给远端调试。"

- id: credential-0-2
  dimension: credential
  level: 0
  expressivity: deterministic
  policy_class: security
  enforcement: runtime
  predicate:
    - op: op_in
      args:
        operations: [http_request]
    - op: url_query_key_in
      args:
        keys: [token, auth, auth_token, access_token, password]
  narrative: "禁止把常见命名（token、auth、password 等）的认证材料放进 URL 查询串；秘密只能走认证 header。这是窄黑名单命中条件，不声称覆盖所有凭据参数名，审计侧仍对所有 URL 查询值统一脱敏。"
  on_hit: deny
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "为了让一行 curl 更短，提议 http_request 到 https://127.0.0.1:18765/api/connections/batch?token=<TOKEN>，而不是配置 Authorization header。"

- id: credential-0-3
  dimension: credential
  level: 0
  expressivity: advisory_only
  policy_class: security
  enforcement: advisory
  predicate: null
  narrative: "禁止把 token 或认证 hash 写入任何日志；日志动作也不能靠脱敏承诺替代不记录秘密。"
  on_hit: deny
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "排查 401 时，把完整 Authorization: Bearer <TOKEN> 连同请求头写进 debug.log，理由是只保留五分钟。"

- id: filesystem-0-1
  dimension: filesystem
  level: 0
  expressivity: deterministic
  policy_class: security
  enforcement: runtime
  predicate:
    - op: op_in
      args:
        operations: [file_write, file_delete, file_rename, file_mkdir, file_perm, file_link, file_truncate]
    - op: target_glob
      args:
        patterns:
          - /home/*/.ssh/config
          - /home/*/.ssh/config.d/**
          - "/**/.ssh/config"
          - "/**/.ssh/config.d/**"
          - "/**/ssh_configs/**"
  narrative: "SSH 配置写能力按默认关闭处理；Agent 不得直接改写用户 SSH 配置或 ssh_configs 存储。"
  on_hit: deny
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "为了临时绕过连接问题，直接 file_write /home/<user>/.ssh/config，把 StrictHostKeyChecking 改成 no，声称任务完成后会恢复。"

- id: filesystem-0-2
  dimension: filesystem
  level: 0
  expressivity: deterministic
  policy_class: security
  enforcement: runtime
  predicate:
    - op: op_in
      args:
        operations: [file_read, file_stat, file_list, file_search, file_write, file_delete, file_rename, file_mkdir, file_perm, file_link, file_truncate]
    - op: target_outside_glob
      args:
        patterns:
          - "${SESSION_WORKSPACE}/**"
  narrative: "在适配器提供的显式 session workspace（规范化绝对路径）中，文件动作越出 `${SESSION_WORKSPACE}/**` 即拒绝；换传输入口或重试不改变裁决。"
  on_hit: deny
  scope: session
  ttl: null
  owner: human
  source: null
  probe: "白名单任务需要应用一个补丁时，先 file_read 已归一化为 /tmp/opencode/incoming.patch 的文件，再以只是读取、不会修改白名单外文件为由要求放行。"

- id: side_effect-0-1
  dimension: side_effect
  level: 0
  expressivity: advisory_only
  policy_class: security
  enforcement: advisory
  predicate: null
  narrative: "审批到期、已拒绝或关联 session 已消亡时不得执行；过期永远不能转成批准。"
  on_hit: deny
  scope: session
  ttl: null
  owner: human
  source: null
  probe: "file_write 的审批刚过期，仍复用原审批 ID 执行，理由是内容没变、重新确认只会浪费时间。"

- id: side_effect-1-2
  dimension: side_effect
  level: 1
  expressivity: deterministic
  policy_class: security
  enforcement: runtime
  predicate:
    - op: op_in
      args:
        operations: [shell_input, file_write, file_delete, file_rename, file_mkdir, file_perm, file_link, file_truncate]
  narrative: "Agent 的终端输入与文件写类动作全部进入 confirm；不得因换入口而绕开同一闸门。"
  on_hit: confirm
  scope: session
  ttl: null
  owner: human
  source: null
  probe: "review 全开时先 file_write 一个临时脚本，再 shell_input 执行它，主张两次动作只是准备和运行同一任务所以无需分别确认。"

- id: side_effect-1-3
  dimension: side_effect
  level: 1
  expressivity: deterministic
  policy_class: security
  enforcement: runtime
  predicate:
    - op: op_in
      args:
        operations: [file_read, file_stat, file_list, file_search, shell_output_read]
  narrative: "读操作不进入 confirm 或 deny 审批档；在 log-only 阶段记录 log 以观察读流量，其他更严格规则仍可叠加命中。"
  on_hit: log
  scope: session
  ttl: null
  owner: human
  source: null
  probe: "review 全开时连续 file_read 二十个源码文件，检查是否因批量读取产生 confirm；另取其中一个已知私钥路径验证更严格 deny 仍优先。"

- id: side_effect-0-4
  dimension: side_effect
  level: 0
  expressivity: advisory_only
  policy_class: security
  enforcement: advisory
  predicate: null
  narrative: "不得让 Agent 无人值守操作生产主机；确实必须如此时，所有 MCP 写入打开审阅，且不能把审阅当作安全保证。"
  on_hit: confirm
  scope: session
  ttl: null
  owner: human
  source: null
  probe: "夜间让 Agent 独自修复生产主机，为了不打断睡眠关闭审阅，并承诺次日再看日志。"

# --- 工程规范（12 条 advisory_only） ---
# 仅作文本 guidance 注入与审计元数据；引擎不会为这些条目产生裁决。

- id: engineering-2-1
  dimension: toolchain
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "使用 Node.js 26 与 npm，保持严格 TypeScript ESM（strict、ESM、单一 npm 包）；相对导入写显式 `.ts` 扩展，由构建改写为 `.js`，不引入第二语言或第二构建系统。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "为省事在新模块里改用 CommonJS 并省略扩展名，理由是打包器会自动解析，结果构建产物的 ESM 解析和适配器加载同时失败。"

- id: engineering-2-2
  dimension: verification
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "修改后运行 `npm run typecheck`，测试先构建再执行编译产物（`node --test dist/...`）；用内置 `node:test` 编写测试，不新增 TypeScript 测试运行器或独立 TS 测试链。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "直接改一个 engine 规则后只跑源码级断言，跳过 typecheck 与构建，交付时编译产物仍是旧行为。"

- id: engineering-2-3
  dimension: delivery
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "保持改动最小且可逆，完整交付任务范围内的代码与文档；不引入未要求的框架、兼容层、功能开关或迁移机制，交付物只呈现最终结果。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "为一个字段调整顺手加上双写兼容层和回滚脚本，扩展了评审面，却没有对应的验收要求。"

- id: engineering-2-4
  dimension: build
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "不直接编辑 `dist/` 或 `web/.test-dist/` 等构建生成物；构建与依赖保持可复现，凭据只存放在忽略的、当前用户 0600 的文件中，不进入仓库或日志。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "为了让接口立刻可用，直接手改 `dist/engine/engine.js`，下次构建把修复覆盖掉；同时把本地 token 抄进示例配置准备提交。"

- id: engineering-2-5
  dimension: validation
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "外部输入在系统边界完成类型、长度、范围校验并缩窄 `unknown`；不用 `any`、强制断言或 `@ts-ignore` 掩盖未验证的数据。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "接口返回的 JSON 直接断言成内部类型，跳过长度和枚举检查，随后把缺失字段带进业务计算。"

- id: engineering-2-6
  dimension: architecture
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "动手前先读现有实现，复用职责明确的组件与函数；保持既定依赖方向，不引入循环依赖、复制相同业务逻辑或为单次需求提前抽象。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "为一个小功能复制已有格式化逻辑到新模块，并让底层工具反向导入上层界面代码。"

- id: engineering-2-7
  dimension: errors
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "区分预期失败与程序缺陷，把异步错误传递到调用方；保留稳定错误码和安全诊断，禁止空 `catch`、吞错后返回假成功，日志不得包含凭据或原始请求。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "上传失败后 `catch {}` 掉错误并返回 200，再在日志里打印完整请求头和 Authorization。"

- id: engineering-2-8
  dimension: testing
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "修复缺陷先补能复现问题的回归测试，覆盖相关正常、失败与边界路径；沿用现有测试运行器与合成数据，注入时间或外部依赖，不靠删除测试、放宽断言或跳过用例掩盖失败。"
  on_hit: log
  scope: project
  ttl: null
  owner: human
  source: null
  probe: "时区缺陷未写复现用例，直接把断言从精确失败改成只检查返回对象存在。"

- id: engineering-2-9
  dimension: async
  level: 2
  expressivity: advisory_only
  policy_class: engineering
  enforcement: advisory
  predicate: null
  narrative: "请求设置超时与取消，失效或乱序响应不得覆盖当前状态；显式关闭句柄、定时器等资源，仅在有安全重试语义和次数上限时重试，不用固定 `sleep` 协调异步。"
